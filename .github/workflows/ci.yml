name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  core-and-build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Core protocol tests
        run: swift test
      - name: Build native iOS app
        run: xcodebuild -scheme Iris -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
