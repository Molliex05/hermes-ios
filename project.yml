name: HermesIOS
options:
  bundleIdPrefix: org.hermesios
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: 1
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    GENERATE_INFOPLIST_FILE: NO
targets:
  HermesIOS:
    type: application
    platform: iOS
    sources: [HermesIOS]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.hermesios.HermesIOS
        INFOPLIST_FILE: HermesIOS/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
    scheme:
      testTargets: [HermesIOSUITests]
  HermesIOSUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [HermesIOSUITests]
    dependencies:
      - target: HermesIOS
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: HermesIOS
schemes:
  HermesIOSIntegration:
    build:
      targets:
        HermesIOS: all
        HermesIOSUITests: [test]
    test:
      targets: [HermesIOSUITests]
      environmentVariables:
        HERMES_IOS_INTEGRATION: "1"
  HermesIOS:
    build:
      targets:
        HermesIOS: all
        HermesIOSUITests: [test]
    test:
      targets: [HermesIOSUITests]
