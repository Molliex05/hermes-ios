name: HermesIOS
options:
  bundleIdPrefix: org.hermesios
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: 1
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    GENERATE_INFOPLIST_FILE: NO
packages:
  WebRTC:
    url: https://github.com/stasel/WebRTC.git
    exactVersion: 153.0.0
targets:
  HermesIOS:
    type: application
    platform: iOS
    sources: [HermesIOS]
    dependencies:
      - package: WebRTC
      - target: HermesIOSNotificationService
        embed: true
      - target: HermesIOSWidgets
        embed: true
      - target: HermesIOSShare
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.hermesios.HermesIOS
        INFOPLIST_FILE: HermesIOS/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: HermesIOS/Resources/HermesIOS.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
    scheme:
      testTargets: [HermesIOSUITests]
  HermesIOSNotificationService:
    type: app-extension
    platform: iOS
    sources:
      - HermesIOSNotificationService
      - path: HermesIOS/Core
        includes:
          - JSONValue.swift
          - NotificationCrypto.swift
          - NotificationEnvelope.swift
          - NotificationKeyStore.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.hermesios.HermesIOS.NotificationService
        INFOPLIST_FILE: HermesIOSNotificationService/Info.plist
        CODE_SIGN_ENTITLEMENTS: HermesIOSNotificationService/HermesIOSNotificationService.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: YES
  HermesIOSWidgets:
    type: app-extension
    platform: iOS
    sources:
      - HermesIOSWidgets
      - path: HermesIOS/Core
        includes:
          - JSONValue.swift
          - SharedBlob.swift
          - AgentBoard.swift
      - path: HermesIOS/LiveActivity
        includes:
          - HermesActivityAttributes.swift
          - ActivityIntents.swift
      - path: HermesIOS/Features
        includes:
          - OrbView.swift
          - AgentLook.swift
          - AppIntents/AgentEntity.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.hermesios.HermesIOS.Widgets
        INFOPLIST_FILE: HermesIOSWidgets/Info.plist
        CODE_SIGN_ENTITLEMENTS: HermesIOSWidgets/HermesIOSWidgets.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: YES
  HermesIOSShare:
    type: app-extension
    platform: iOS
    sources:
      - HermesIOSShare
      - path: HermesIOS/Core
        includes:
          - JSONValue.swift
          - SharedBlob.swift
          - AgentBoard.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.hermesios.HermesIOS.Share
        INFOPLIST_FILE: HermesIOSShare/Info.plist
        CODE_SIGN_ENTITLEMENTS: HermesIOSShare/HermesIOSShare.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: YES
  HermesIOSVoiceTests:
    type: bundle.unit-test
    platform: iOS
    sources: [HermesIOSVoiceTests]
    dependencies:
      - target: HermesIOS
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/HermesIOS.app/HermesIOS"
        BUNDLE_LOADER: "$(TEST_HOST)"
  HermesIOSUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [HermesIOSUITests]
    dependencies:
      - target: HermesIOS
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: HermesIOS
schemes:
  HermesIOSIntegration:
    build:
      targets:
        HermesIOS: all
        HermesIOSUITests: [test]
        HermesIOSVoiceTests: [test]
    test:
      targets: [HermesIOSUITests, HermesIOSVoiceTests]
      environmentVariables:
        HERMES_IOS_INTEGRATION: "1"
  HermesIOS:
    build:
      targets:
        HermesIOS: all
        HermesIOSUITests: [test]
    test:
      targets: [HermesIOSUITests]
