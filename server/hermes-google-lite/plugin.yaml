name: hermes-google-lite
version: 0.2.0
description: "Gmail (chercher, lire, brouillons, ranger en dossiers et sous-dossiers, archiver — jamais d'envoi ni de suppression) et Google Calendar (lister, créer des événements)."
author: Hermès iOS
kind: standalone
requires_hermes: ">=0.21.0"
optional_env:
  - GOOGLE_CLIENT_ID
  - GOOGLE_CLIENT_SECRET
  - GOOGLE_REFRESH_TOKEN
provides_tools:
  - gmail_chercher
  - gmail_lire
  - gmail_brouillon
  - gmail_trier
  - gmail_dossiers
  - agenda_lister
  - agenda_creer
