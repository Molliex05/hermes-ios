name: hermes-ios-push
version: 0.5.0
description: Private Apple notifications for Hermès iOS (encrypted preview, presence), Live Activity updates, silent widget refresh, the ios_notify and terminer_appel tools, and calls an agent plans to the iPhone (VoIP push, CallKit).
provides_hooks:
  - post_llm_call
  - pre_tool_call
provides_tools:
  - ios_notify
  - terminer_appel
  - appel_planifier
  - appel_annuler
  - appels_prevus
